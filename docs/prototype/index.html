<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叁序 · 交互设计</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222725;--muted:#646b65;--line:#dedfd6;--accent:#b43c32;--tint:#f6e8e2;--olive:#e7ebdc;--soft:#eef0e8}*{box-sizing:border-box}body{margin:0;background:#deded5;color:var(--ink);font-family:"Microsoft YaHei",sans-serif}body.dark{--bg:#151b19;--card:#202823;--ink:#eeefe6;--muted:#b9c2b9;--line:#465148;--accent:#ffb4a9;--tint:#44302a;--olive:#354131;--soft:#29352d;background:#101410}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent;min-height:48px;border-radius:12px;padding:0 14px;transition:background .15s}button:active{background:var(--tint)}button:disabled{opacity:.4;cursor:default}h1,h2,h3,p{margin:0}small{color:var(--muted)}.wrap{display:flex;gap:60px;max-width:1060px;margin:40px auto;align-items:center;padding:16px}.intro{max-width:370px}.intro h1{font-size:54px;letter-spacing:8px;margin:16px 0}.intro p{line-height:1.9;color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:bold}.phone{position:relative;width:393px;height:852px;min-width:360px;background:var(--bg);border:7px solid #202822;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 25px 80px #1d271a22}.status{padding:12px 22px 0;font-size:12px;display:flex;justify-content:space-between}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 4px}.head h2{font-size:26px;letter-spacing:2px}.page{flex:1;min-height:0;overflow:auto;padding:12px 18px}.nav{display:flex;border-top:1px solid var(--line);padding:4px 8px 12px;background:var(--bg)}.nav button{flex:1;font-size:12px;padding:4px}.nav svg{display:block;margin:0 auto 3px;width:22px;height:22px}.nav .on{color:var(--accent);font-weight:bold}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.section{margin:16px 0 10px;font-size:15px}.hero{padding:16px;background:var(--olive);border-radius:20px}.balls{display:flex;gap:12px;margin:12px 0;justify-content:center}.balls b{font:600 54px ui-monospace,monospace;flex:1;text-align:center}.attrs{display:flex;justify-content:space-between;font-size:12px;padding:12px 0;border-top:1px solid #79826844}.pill{background:var(--soft);border-radius:8px;padding:6px 10px;font-size:12px}.digits{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.digits button{background:var(--card);border:1px solid var(--line);font:500 21px ui-monospace,monospace;min-height:48px}.digits .on{background:var(--accent);color:var(--bg);border-color:var(--accent)}.tabs{display:flex;background:var(--soft);padding:4px;border-radius:14px;gap:2px;margin-bottom:16px}.tabs button{flex:1;padding:0 7px;font-size:14px}.tabs .on{background:var(--card);color:var(--accent);font-weight:bold;box-shadow:0 2px 4px #00000009}.summary{padding:12px 18px;background:var(--card);border-top:1px solid var(--line)}.primary{background:var(--accent);color:var(--bg);font-weight:bold}.entry{font:600 50px ui-monospace,monospace;letter-spacing:22px;padding:18px 0;text-align:center;background:var(--card);border-radius:16px;margin-bottom:16px}.source{padding:12px 0;border-bottom:1px solid var(--line)}.nums{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.num{font:500 16px ui-monospace,monospace;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}.num small{font-size:11px}.hint{padding:14px;background:var(--soft);border-radius:12px;font-size:13px;line-height:1.7;color:var(--muted)}.empty{padding:56px 12px;text-align:center;color:var(--muted)}.empty h3{color:var(--ink);margin:12px}.modal{position:absolute;inset:0;background:#0006;display:grid;place-items:center;padding:22px;z-index:10}.dialog{background:var(--card);padding:24px;border-radius:24px;max-width:100%;line-height:1.8}.dialog p{margin:12px 0;color:var(--muted)}table{border-collapse:collapse;font-size:12px;width:100%}td,th{padding:9px 5px;border-bottom:1px solid var(--line);text-align:center}td.hit{color:var(--accent);font-weight:bold}.trial{padding:12px 0;border-top:1px solid var(--line)}.chart{overflow:auto;margin:0 -18px}.intro button{background:#222725;color:white;margin-top:24px}.position-label{margin:10px 0 6px;font-size:12px;font-weight:bold}.select{border:0;background:var(--soft);padding:8px;border-radius:8px}input{background:var(--card);border:1px solid var(--line);padding:10px;border-radius:8px;max-width:120px} @media(max-width:760px){.wrap{margin:0;padding:0;display:block}.intro{display:none}.phone{width:100%;height:100dvh;border:0;border-radius:0;min-width:320px}.status{display:none}.page{padding-top:8px}}
</style><div class="wrap"><aside class="intro"><div class="eyebrow">SANXU / THREE DIGITS</div><h1>叁序</h1><p>三个数字，各有次序。<br>把熟悉的选号方式放在手边，<br>把每一期的思路留在一起。</p><button onclick="document.body.classList.toggle('dark')">切换深浅色</button><p style="margin-top:24px;font-size:13px">可点击四种选号、加入本期、重复合并、撤销及查看来源。走势图使用项目真实历史数据。原型记录只保存在此浏览器。</p></aside><main class="phone"><div class="status"><span>9:41</span><span>● ● ▰</span></div><header class="head"><h2 id="title">叁序</h2><button onclick="document.body.classList.toggle('dark')" aria-label="切换主题">◐</button></header><section id="page" class="page"></section><section id="summary"></section><nav id="nav" class="nav"></nav><div id="overlay"></div></main></div>
<script src="history.js"></script><script>
const names=['首页','走势','选号','方案','彩报'],methods=['单选','组选','单选单','位选'];const paths=['M3 10 12 3l9 7v10h-6v-6H9v6H3z','M3 20V4m0 16h18M6 15l4-5 4 3 6-8','M5 6h14M5 12h14M5 18h14M9 3v6m6 0v6m-5 0v6','M5 3h14v18H5zM8 8h8m-8 4h8m-8 4h5','M4 4h16v16H4zM7 7h10M7 11h4m-4 4h10'];let tab=0,method=0,pool=new Set(),positions=[new Set(),new Set(),new Set()],number='',group='g6',multiple=1,entries=JSON.parse(localStorage.getItem('sanxu-prototype')||'[]'),lastId=null;
const latest=historyData.at(-1),issue=String(Number(latest.issue)+1);const canonical=s=>[...s].sort().join('');const play=()=>method===1?group:'single';
function candidates(){if(method===0)return /^\d{3}$/.test(number)?[number]:[];let r=[];for(let n=0;n<1000;n++){let s=String(n).padStart(3,'0'),d=[...s].map(Number),distinct=new Set(d).size;if(method===1&&d.every(v=>pool.has(v))&&distinct===(group==='g3'?2:3))r.push(canonical(s));if(method===2&&distinct===3&&d.every(v=>pool.has(v)))r.push(s);if(method===3&&d.every((v,i)=>positions[i].has(v)))r.push(s)}return [...new Set(r)]}
function merged(){let m={};entries.forEach(e=>e.n.forEach(n=>{let k=e.p+n;m[k]??={n,p:e.p,m:0};m[k].m+=e.m}));return Object.values(m).sort((a,b)=>a.n.localeCompare(b.n))}function persist(){localStorage.setItem('sanxu-prototype',JSON.stringify(entries))}function icon(i){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="${paths[i]}"/></svg>`}
function grid(set,position=-1){return `<div class="digits">${Array.from({length:10},(_,n)=>`<button class="${set.has(n)?'on':''}" onclick="digit(${n},${position})">${n}</button>`).join('')}</div>`}function digit(n,p){if(method===0){number=number.length===3?String(n):number+n}else{let s=p<0?pool:positions[p];s.has(n)?s.delete(n):s.add(n)}render()}
function add(){let n=candidates();if(!n.length)return;const prior=new Set(merged().filter(x=>x.p===play()).map(x=>x.n)),repeated=n.filter(x=>prior.has(x)).length;lastId=Date.now();entries.push({id:lastId,n,p:play(),m:multiple,method:methods[method]});persist();if(method===0)number='';render();dialog(repeated?'已自动合并':'已加入本期',repeated?`${repeated}个重复号码已累计倍数。现在共${merged().length}个号码，合计${merged().reduce((a,b)=>a+b.m,0)}注。`:'选号已记录，可以继续选择或查看本期清单。',true)}
function dialog(title,text,undo=false){document.getElementById('overlay').innerHTML=`<div class="modal"><div class="dialog"><h3>${title}</h3><p>${text}</p><div class="row">${undo?'<button onclick="entries=entries.filter(e=>e.id!==lastId);persist();closeDialog();render()">撤销本次加入</button>':''}<button class="primary" onclick="closeDialog()">知道了</button></div></div></div>`}function closeDialog(){document.getElementById('overlay').innerHTML=''}
function render(){document.getElementById('title').textContent=tab===0?'叁序':names[tab];document.getElementById('nav').innerHTML=names.map((n,i)=>`<button class="${i===tab?'on':''}" onclick="tab=${i};render()">${icon(i)}${n}</button>`).join('');let p='',s='';
if(tab===0){let d=latest.digits,sum=d.reduce((a,b)=>a+b,0);p=`<div class="row" style="margin-bottom:12px"><small>中国福利彩票 · 3D</small><button class="pill" onclick="dialog('开奖详情','${latest.issue}期 · ${latest.drawDate} · ${d.join('')}')">${latest.issue}期 ›</button></div><div class="hero"><div class="row"><small>最近开奖</small><small>${latest.drawDate}</small></div><div class="balls">${d.map(x=>`<b>${x}</b>`).join('')}</div><div class="attrs"><span>和值 <b>${sum}</b></span><span>跨度 <b>${Math.max(...d)-Math.min(...d)}</b></span><span>形态 <b>${new Set(d).size===3?'组六':'组三'}</b></span></div></div><h3 class="section">每一位，都有迹可循</h3><div class="row">${d.map((v,i)=>{let before=historyData.slice(0,-1).reverse(),idx=before.findIndex(x=>x.digits[i]===v);return `<div class="hint" style="flex:1">${['百位','十位','个位'][i]} ${v}<br><b>${idx<0?'≥30':idx} 期</b><br>开奖前遗漏</div>`}).join('')}</div><h3 class="section">云南省开奖公告</h3><div class="hint">本期公告待更新 <button onclick="dialog('更新状态','原型使用项目历史基线，实时更新由Android应用提供。')">刷新</button></div><div class="row trial" style="margin-top:16px"><b>试机号</b><span>— — —</span></div><button class="hero row" style="width:100%;text-align:left" onclick="tab=3;render()"><span>我的本期清单<br><small>${merged().length}个号码</small></span><b>查看 →</b></button>`}
if(tab===2){p=`<div class="row" style="margin-bottom:12px"><small>目标期号</small><span class="pill">${issue}期</span></div><div class="tabs">${methods.map((m,i)=>`<button class="${method===i?'on':''}" onclick="method=${i};render()">${m}</button>`).join('')}</div>`;if(method===0)p+=`<div class="entry">${number.padEnd(3,'—')}</div><div class="row" style="margin-bottom:12px"><small>按百、十、个位依次输入</small><button onclick="number=number.slice(0,-1);render()">退格</button></div>${grid(new Set())}`;if(method===1)p+=`<div class="tabs"><button class="${group==='g3'?'on':''}" onclick="group='g3';render()">组三</button><button class="${group==='g6'?'on':''}" onclick="group='g6';render()">组六</button></div>${grid(pool)}<p class="hint" style="margin-top:14px">${group==='g3'?'选择至少2个数字，生成两个相同、一个不同的组合。':'选择至少3个数字，生成三位不同的组合。'}顺序不限。</p>`;if(method===2)p+=`<h3 class="section">选一组数字，展开所有次序</h3>${grid(pool)}<p class="hint" style="margin-top:14px">选择至少3个不同数字。比如选择0、1、2，生成012、021等6注单选。</p>`;if(method===3)p+=positions.map((x,i)=>`<div class="position-label">${['百位','十位','个位'][i]} <small>已选${x.size}个</small></div>${grid(x,i)}`).join('');let c=candidates();p+=`<button onclick="dialog('号码明细','${c.length?c.slice(0,60).join('　'):'选完整后在这里查看号码'}${c.length>60?' …':''}')">查看号码 (${c.length}) ›</button>`;s=`<div class="summary"><div class="row"><span><b>${c.length}</b> 个号码 <select class="select" onchange="multiple=Number(this.value);render()">${[1,2,3,5,10,99].map(n=>`<option ${multiple===n?'selected':''} value="${n}">${n}倍</option>`)}</select><br><small>合计 <b>${c.length*multiple*2}</b> 元</small></span><button class="primary" ${!c.length?'disabled':''} onclick="add()">加入本期</button></div></div>`}
if(tab===3){let m=merged(),units=m.reduce((a,b)=>a+b.m,0);p=`<div class="tabs"><button class="on">本期</button><button onclick="dialog('往期','已开奖的清单会在这里按期号排列。')">往期</button></div><div class="hero"><small>${issue}期 · 待开奖</small><div class="row" style="margin-top:14px"><span><b style="font-size:36px">${m.length}</b> 个号码</span><span><b style="font-size:30px">${units*2}</b> 元</span></div><small>合计 ${units} 注（含倍数）</small></div>`;if(!m.length)p+=`<div class="empty"><h3>把本期思路放在一起</h3><p>从四种熟悉的方式开始选号</p><button class="primary" style="margin-top:20px" onclick="tab=2;render()">去选号</button></div>`;else{p+=`<h3 class="section">本期号码</h3><div class="nums">${m.map(b=>`<span class="num">${b.n} <small>${b.m}倍 · ${b.p==='single'?'单选':b.p==='g3'?'组三':'组六'}</small></span>`).join('')}</div><h3 class="section">选号记录</h3>${entries.map(e=>`<div class="source row"><span>${e.method}<br><small>${e.n.length}个号码 · ${e.m}倍</small></span><button onclick="entries=entries.filter(x=>x.id!==${e.id});persist();render()">删除</button></div>`).join('')}`}}
if(tab===1){p=`<div class="row"><small>最近30期 · 百十个位</small><span class="pill">位置走势</span></div><div class="chart"><table><thead><tr><th>期号</th><th>开奖号</th>${Array.from({length:10},(_,i)=>`<th>${i}</th>`).join('')}<th>和值</th></tr></thead><tbody>${historyData.slice(-30).map(d=>`<tr><td>${d.issue.slice(-3)}</td><td>${d.digits.join('')}</td>${Array.from({length:10},(_,i)=>`<td class="${d.digits.includes(i)?'hit':''}">${d.digits.includes(i)?'●':''}</td>`).join('')}<td>${d.digits.reduce((a,b)=>a+b,0)}</td></tr>`).join('')}</tbody></table></div>`}
if(tab===4)p=`<div class="row"><small>A11第三版</small><span class="pill">选择期号</span></div><div class="empty"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v16H4zM7 8h10M7 12h4M7 16h10"/></svg><h3>等待本期彩报</h3><p>有内容后可在这里阅读与换期</p><button class="primary" style="margin-top:20px" onclick="dialog('彩报','原型不下载第三方图片。应用支持最近30个自然日换期、缩放和重试。')">重新检查</button></div>`;
document.getElementById('page').innerHTML=p;document.getElementById('summary').innerHTML=s}
render();
</script></html>
